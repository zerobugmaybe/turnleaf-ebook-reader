<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reading app</title>
  <link rel="stylesheet" href="journal.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>

  <main>
    <section id="library-view" class="view" aria-label="Library" hidden>
      <!-- Your shelf goes here -->
      <h1 style="font-family:var(--jn-serif,serif);padding:24px 20px 0">Library</h1>
    </section>

    <section id="reader-view" class="view" aria-label="Reader" hidden>
      <h1 style="font-family:var(--jn-serif,serif);padding:24px 20px 0">Reader</h1>
      <!-- Example hook: save a note for the book being read -->
      <button type="button" class="jn-btn jn-btn--primary" style="margin:16px 20px"
              onclick="openJournalForBook('The Overstory', 214)">Add a journal note</button>
    </section>

    <section id="journal-view" class="view" aria-label="Journal" hidden>
      <div id="journal-root"></div>
    </section>

    <section id="settings-view" class="view" aria-label="Settings" hidden>
      <h1 style="font-family:var(--jn-serif,serif);padding:24px 20px 0">Settings</h1>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main">
    <a class="nav-tab" href="#/library" data-route="library">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5M4 20h16M9 20V8M14 20V5M19 20v-9"/></svg></span>
      <span>Library</span>
    </a>
    <a class="nav-tab" href="#/read" data-route="read">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-13C17 4 14 4.5 12 6zM12 6v13"/></svg></span>
      <span>Read</span>
    </a>
    <a class="nav-tab" href="#/journal" data-route="journal">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4zM13.5 6.5l4 4"/></svg></span>
      <span>Journal</span>
    </a>
    <a class="nav-tab" href="#/settings" data-route="settings">
      <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span>
      <span>Settings</span>
    </a>
  </nav>

  <!-- journal.js first so #journal-root is mounted before routing starts -->
  <script src="journal.js"></script>
  <script src="nav.js"></script>
</body>
</html>
